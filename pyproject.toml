[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apply-pilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "pydantic>=2.13.4",
]

[project.scripts]
parse-offer = "src.services.parse_offer:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
