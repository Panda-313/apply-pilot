[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apply-pilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "ddgs>=9.15.0",
    "dotenv>=0.9.9",
    "duckduckgo-search>=8.1.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.1",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "questionary>=2.1.1",
]

[project.scripts]
parse-offer = "src.services.parse_offer:main"
parse-cv = "src.services.parse_cv:main"
graph = "src.services.parse_cv:main"
api = "api:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
